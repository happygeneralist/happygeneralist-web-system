name: Check web system

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check profile, provenance and schema behaviour
        run: |
          npm test
          npm run profile:validate
          npm run profile:check
          npm run skills:verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and verify rendered interfaces
        run: npm run test:interface

      - name: Retain rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-evidence
          path: |
            docs/interface/evidence/
            playwright-report/
          retention-days: 14
